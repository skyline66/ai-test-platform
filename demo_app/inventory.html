<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>橙子商城 · 我的订单</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="inventory">
  <header class="topbar">
    <span class="brand" data-testid="brand">橙子商城</span>
    <nav aria-label="主导航">
      <button id="cart-btn" type="button" aria-haspopup="dialog" aria-label="购物车">
        购物车 (<span data-testid="cart-count">0</span>)
      </button>
    </nav>
  </header>

  <main>
    <h1>我的订单</h1>
    <p class="hint">以下为可购买商品，点「加入购物车」后再打开购物车结算。</p>

    <ul class="items" aria-label="商品列表">
      <li>
        <span class="name">橙子礼盒</span>
        <span class="price" data-testid="price">¥ 88.00</span>
        <button type="button" data-add data-name="橙子礼盒">加入购物车</button>
      </li>
      <li>
        <span class="name">橙子果酱</span>
        <span class="price" data-testid="price">¥ 32.50</span>
        <button type="button" data-add data-name="橙子果酱">加入购物车</button>
      </li>
      <li>
        <span class="name">橙子汽水</span>
        <span class="price" data-testid="price">¥ 9.90</span>
        <button type="button" data-add data-name="橙子汽水">加入购物车</button>
      </li>
    </ul>
  </main>

  <dialog id="cart-dialog" aria-labelledby="cart-title">
    <h2 id="cart-title">购物车</h2>
    <ul id="cart-items" aria-label="购物车商品"></ul>
    <p id="cart-empty">购物车是空的</p>
    <p id="checkout-status" role="status" hidden></p>
    <div class="dialog-actions">
      <button id="checkout" type="button">结算</button>
      <button id="close" type="button">关闭</button>
    </div>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
